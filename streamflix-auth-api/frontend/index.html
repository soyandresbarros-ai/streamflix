<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamFlix | Registro e inicio de sesión</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="tarjeta">
      <h1>Stream<span class="acento">Flix</span></h1>

      <!-- Pestañas para alternar entre el formulario de registro y el de login -->
      <div class="pestanas" role="tablist">
        <button type="button" class="pestana activa" data-formulario="registro" id="tab-registro">
          Registrarse
        </button>
        <button type="button" class="pestana" data-formulario="login" id="tab-login">
          Iniciar sesión
        </button>
      </div>

      <!-- Formulario de registro -->
      <form id="form-registro" class="formulario" novalidate>
        <label for="registro-usuario">Usuario</label>
        <input type="text" id="registro-usuario" name="usuario" autocomplete="username" required />

        <label for="registro-password">Contraseña</label>
        <input
          type="password"
          id="registro-password"
          name="password"
          autocomplete="new-password"
          minlength="6"
          required
        />
        <p class="ayuda">Mínimo 6 caracteres.</p>

        <button type="submit">Crear cuenta</button>
      </form>

      <!-- Formulario de inicio de sesión (oculto por defecto) -->
      <form id="form-login" class="formulario oculto" novalidate>
        <label for="login-usuario">Usuario</label>
        <input type="text" id="login-usuario" name="usuario" autocomplete="username" required />

        <label for="login-password">Contraseña</label>
        <input
          type="password"
          id="login-password"
          name="password"
          autocomplete="current-password"
          required
        />

        <button type="submit">Ingresar</button>
      </form>

      <!-- Región donde se muestran los mensajes de éxito o error del servicio -->
      <p id="mensaje" class="mensaje" aria-live="polite"></p>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
